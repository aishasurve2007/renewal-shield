# Run the test suite on every push and pull request. No API keys, no OCR engine, about 2 seconds of tests.
# Separate from build-image.yml on purpose: tests run on every branch, the image is only built from main.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest -q
