# Build the web app's Docker image on every push and publish it to GitHub's container registry (ghcr.io).
# Azure Container Apps then runs this image (see deploy_azure.ps1). Azure for Students can't build
# images itself (ACR Tasks are blocked), so the build happens here, for free.
name: Build image

on:
  push:
    branches: [main, master]
    paths:
      - "app.py"
      - "check_contract.py"
      - "classify_llm.py"
      - "classify_baseline.py"
      - "ocr_pipeline.py"
      - "law_index.py"
      - "law/articles.json"
      - "renewal_shield_clause_bank_v0.3.xlsx"
      - "static/**"
      - "requirements-app.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (ghcr needs lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
